name: Claude review

# Claude reviews each pull request with the team's review skill and reports
# on the run's summary page. It only reads and reports: a person merges.
on:
  pull_request:

# One review per pull request: a new push cancels the review still running.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The job token can only read; github_token below makes Claude use it.
    permissions:
      contents: read
    steps:
      # The full history, so git diff can compare the pull request with its
      # base, and the checkout puts .claude/skills/ where the action finds it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # v1.0.258, which installs Claude Code v2.1.308.
      - uses: anthropics/claude-code-action@6b6870e649b5ff408753befeaee5fc7989d4e6a9
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: /team-review
          claude_args: |
            --model sonnet
            --max-turns 5
            --allowedTools "Bash(git diff *)"
          display_report: true
