name: Claude review

# Claude reviews each pull request and reports on the run's summary page. It
# only reads and reports: a person merges.
on:
  pull_request:

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The job token can only read; github_token below makes Claude use it.
    permissions:
      contents: read
    steps:
      # The full history, so git diff can compare the pull request with its base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # v1.0.237, which installs Claude Code v2.1.285.
      - uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Review the changes this pull request makes: run
            `git diff origin/${{ github.base_ref }}...HEAD`, then read the files it
            changes. List each problem as file:line and one sentence, then say
            whether it is ready to merge. Don't change any files.
          claude_args: |
            --model sonnet
            --max-turns 5
            --allowedTools "Bash(git diff *)"
          display_report: true
